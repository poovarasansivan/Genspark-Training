<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center text-violet-700">Login</h2>
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-medium mb-1">Username</label>
        <input
          type="text"
          placeholder="Enter your username"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500"
        />
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-medium mb-1">Password</label>
        <input
          type="password"
          placeholder="Enter your password"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500"
        />
      </div>

      <button
        type="button"
        class="w-full bg-violet-600 text-white py-2 rounded-lg hover:bg-violet-700 transition duration-300"
        (click)="signIn()"
      >
        Sign In
      </button>
  </div>
</div>
