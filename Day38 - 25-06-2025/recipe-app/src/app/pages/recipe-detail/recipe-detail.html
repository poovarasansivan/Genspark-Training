<div class="p-6 max-w-4xl mx-auto bg-white shadow-lg rounded-xl mt-6">
  <!-- Loading and Error States -->
  <div *ngIf="isLoading" class="text-center text-gray-600 text-lg">Loading recipe...</div>
  <div *ngIf="error" class="text-red-600 text-center text-lg">{{ error }}</div>

  <!-- Recipe Content -->
  <div *ngIf="!isLoading && recipe">
    <h1 class="text-4xl font-bold text-blue-800 mb-4">{{ recipe.name }}</h1>

    <img
      [src]="recipe.image"
      alt="{{ recipe.name }}"
      class="w-full max-w-2xl rounded-lg shadow-md mx-auto mb-6 object-cover"
    />

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-sm text-gray-700">
      <div><span class="font-semibold text-gray-900">Cuisine:</span> {{ recipe.cuisine }}</div>
      <div><span class="font-semibold text-gray-900">Difficulty:</span> {{ recipe.difficulty }}</div>
      <div><span class="font-semibold text-gray-900">Rating:</span> ⭐ {{ recipe.rating }}</div>
    </div>

    <div class="mb-6">
      <h2 class="text-2xl font-bold text-green-700 mb-2">🧂 Ingredients</h2>
      <ul class="list-disc pl-6 text-gray-800 space-y-1">
        <li *ngFor="let item of recipe.ingredients">{{ item }}</li>
      </ul>
    </div>

    <div>
      <h2 class="text-2xl font-bold text-purple-700 mb-2">👨‍🍳 Instructions</h2>
      <ol class="list-decimal pl-6 text-gray-800 space-y-2">
        <li *ngFor="let step of recipe.instructions">{{ step }}</li>
      </ol>
    </div>
  </div>
</div>
