<div
  class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden group"
>
  <img
    [src]="recipe.image"
    alt="{{ recipe.name }}"
    class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300"
  />
  <div class="p-4 space-y-2">
    <h2 class="text-xl font-semibold text-gray-800">{{ recipe.name }}</h2>
    <p class="text-sm text-gray-600">
      <strong>Cuisine:</strong> {{ recipe.cuisine }}
    </p>
    <p class="text-sm text-gray-600">
      <strong>Difficulty:</strong> {{ recipe.difficulty }}
    </p>
    <p class="text-sm text-gray-600">
      <strong>Rating:</strong> {{ recipe.rating }}
    </p>

    <button
      (click)="navigate(recipe.id)"
      class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition duration-300"
    >
      View Recipe
    </button>
  </div>
</div>
