<nav
  class="z-50 bg-white border-b border-gray-300 px-6 py-5 flex justify-between items-center shadow-sm sm:px-12"
>
  <div class="flex items-center space-x-4">
    <lucide-angular
      [name]="bookIcon"
      [size]="25"
      color="oklch(59.6% 0.145 163.225)"
    ></lucide-angular>
    <a routerLink="/home" class="text-lg font-semibold hover:text-slate-600">
      <span class="text-blue-700">E-Learn</span>
      <span class="text-emerald-600 ml-1">Platform</span>
    </a>
  </div>

  <div class="hidden md:flex items-center space-x-8">
    <a
      routerLink="/"
      class="relative group text-slate-700 text-lg font-semibold hover:text-slate-800"
    >
      Home
      <span
        class="absolute left-0 bottom-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"
      ></span>
    </a>
    <a
      routerLink="/create-course"
      class="relative group text-slate-700 text-lg font-semibold hover:text-slate-800"
    >
      Create Course
      <span
        class="absolute left-0 bottom-0 w-0 h-0.5 bg-blue-600 transition-all duration-300 group-hover:w-full"
      ></span>
    </a>
  </div>
</nav>

<div class="bg-gray-100 min-h-screen px-4 py-8">
  <div class="flex flex-col lg:flex-row gap-8">
  <div class="w-full lg:w-2/3">
    <video
      [src]="video.blobUrl"
      controls
      class="w-full h-auto rounded-lg shadow-md"
    ></video>
  </div>

  <div
    class="w-full lg:w-1/3 bg-white rounded-lg shadow-md p-6 border border-gray-200"
  >
    <h1 class="text-2xl font-bold text-blue-600 mb-4">{{ video.title }}</h1>
    <p class="text-gray-700 mb-4">{{ video.description }}</p>

    <div class="mb-4">
      <span
        class="inline-block bg-blue-100 text-blue-800 text-sm font-semibold px-3 py-1 rounded"
      >
        {{ video.category }}
      </span>
    </div>

    <div class="mb-2 text-sm text-gray-600">
      <strong>Uploaded on:</strong>
      {{ video.uploadDate | date: 'dd/MM/yyyy' }}
    </div>

    <!-- <div class="mt-6">
        <button
          class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition"
        >
          Enroll Now
        </button>
      </div> -->
  </div>
</div>
</div>
