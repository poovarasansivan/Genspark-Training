<div class="p-6 mx-10 mt-10" (window:scroll)="onScroll()">
  <!-- Search Bar -->
  <div class="flex justify-end items-center mb-6">
    <div class="relative w-1/2">
      <span
        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
      >
        <lucide-angular
          [name]="searchIcon"
          class="w-5 h-5 text-gray-400"
        ></lucide-angular>
      </span>
      <input
        type="text"
        placeholder="Search products..."
        class="w-full h-10 pl-10 pr-4 border-2 border-gray-300 rounded-md text-lg focus:outline-none focus:ring-2 focus:ring-violet-500"
        [(ngModel)]="searchTerm"
        (input)="handleSearch()"
      />
    </div>
  </div>

  <!-- Product Grid -->
  <div
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
  >
    <div
      *ngFor="let product of products"
      class="bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition-shadow duration-300"
    >
      <img
        [src]="product.thumbnail"
        alt="Product Image"
        class="w-full h-48 object-cover rounded-lg mb-4"
      />
      <h3 class="text-lg font-semibold text-gray-800 mb-1" [innerHTML]="product.title | highlight:searchTerm"></h3>

      <p class="text-gray-600 mb-4">${{ product.price }}</p>

      <button
        class="flex items-center justify-center gap-2 w-full cursor-progress bg-violet-600 text-white py-2 rounded-md hover:bg-violet-700 transition-colors duration-300"
      >
        <lucide-angular
          [name]="cartIcon"
          class="w-5 h-5 text-white"
        ></lucide-angular>
        Add to Cart
      </button>
    </div>
  </div>
 <div *ngIf="!loading && products.length === 0" class="text-center text-gray-500 mt-6">
  No products found.
</div>

  <!-- Loading Spinner -->
  <div
    *ngIf="loading"
    class="flex justify-center items-center gap-2 mt-6 text-violet-500 text-lg"
  >
    <svg
      class="animate-spin h-5 w-5 text-violet-500"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
    >
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
      ></path>
    </svg>
    Loading more products...
  </div>
</div>
<button (click)="scrollToTop()" class="fixed bottom-4 right-4 bg-violet-600 text-white p-3 rounded-full">↑</button>
