<footer class="bg-[#F8F8FF] font-sans mt-10">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-8">
      <div class="lg:col-span-2">
        <h2 class="text-3xl font-bold text-[#151875] mb-4">EzartShop</h2>
        <div class="flex items-center mb-4">
          <input
            type="email"
            placeholder="Enter Email Address"
            class="bg-white border border-gray-200 rounded-l-md py-2 px-4 focus:outline-none focus:ring-2 focus:ring-pink-500"
          />
          <button
            class="bg-pink-500 text-white font-semibold py-2 px-6 rounded-r-md hover:bg-pink-600 transition-colors"
          >
            Sign Up
          </button>
        </div>
        <p class="text-gray-500 text-sm">Contact Info</p>
        <p class="text-gray-500 text-sm">
          17 Princess Road, London, Greater London NW1 8JR, UK
        </p>
      </div>

      <div>
        <h3 class="text-xl font-bold text-[#151875] mb-4">Categories</h3>
        <ul class="space-y-2">
          <li *ngFor="let item of categories">
            <a
              href="#"
              class="text-gray-500 hover:text-pink-500 transition-colors"
              >{{ item }}</a
            >
          </li>
        </ul>
      </div>

      <div>
        <h3 class="text-xl font-bold text-[#151875] mb-4">Customer Care</h3>
        <ul class="space-y-2">
          <li *ngFor="let item of customerCare">
            <a
              href="#"
              class="text-gray-500 hover:text-pink-500 transition-colors"
              >{{ item }}</a
            >
          </li>
        </ul>
      </div>

      <div>
        <h3 class="text-xl font-bold text-[#151875] mb-4">Pages</h3>
        <ul class="space-y-2">
          <li *ngFor="let item of pages">
            <a
              href="#"
              class="text-gray-500 hover:text-pink-500 transition-colors"
              >{{ item }}</a
            >
          </li>
        </ul>
      </div>
    </div>
  </div>
