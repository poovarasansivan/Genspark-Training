<div class="bg-[#f3f0ff] flex items-center justify-center h-64 md:px-16">
  <div class="max-w-7xl mx-auto">
    <div
      class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4"
    >
      <div>
        <h3 class="text-2xl font-bold text-[#151875]">Blog Posts</h3>
        <p class="text-gray-600 text-base mt-1">Home &gt; Posts</p>
      </div>
    </div>
  </div>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 px-12 mt-10">
  <div
    *ngFor="let post of posts"
    class="bg-white rounded-2xl shadow-md w-3/4 overflow-hidden flex flex-col h-auto"
    (click)="onPostClick(post)"
    >
    <!-- Image: 30% height -->
    <div class="h-80 w-full relative">
      <img
        [src]="'http://localhost:5045' + post.image"
        [alt]="post.title"
        class="w-full h-full object-cover"
      />
    </div>

    <div class="h-auto p-4 flex flex-col justify-between">
      <div>
        <h2 class="text-lg font-semibold text-[#151875] line-clamp-2">
          {{ post.title }}
        </h2>
        <p class="text-gray-700 text-sm line-clamp-2 mt-1">
          {{ post.shortDescription }}
        </p>
      </div>
      <p class="text-xs text-gray-600 mt-3">
        {{ post.createdDate | date: 'mediumDate' }}
      </p>
    </div>
  </div>
</div>
