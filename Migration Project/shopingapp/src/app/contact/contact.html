<div class="bg-[#f3f0ff] flex items-center justify-center h-64 md:px-16">
  <div class="max-w-7xl mx-auto">
    <div
      class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4"
    >
      <div>
        <h3 class="text-2xl font-bold text-[#151875]">Contact Us</h3>
        <p class="text-gray-600 text-base mt-1">Home &gt; Contact</p>
      </div>
    </div>
  </div>
</div>
<app-toast></app-toast>
<div class="bg-white font-sans text-gray-800 p-4 sm:p-8 flex items-center justify-center min-h-80">
  <div class="max-w-2xl w-full">
    <div class="text-left mb-4">
      <h1 class="text-2xl font-bold text-indigo-900 mb-2">Get In Touch</h1>
      <p class="mt-5text-gray-600 text-lg">
        We would love to hear from you! Please fill out the form below to get in touch with us.
    </p>
    </div>

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
        <div class="md:col-span-1">
          <input type="text" formControlName="name" placeholder="Poovarasan" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-colors">
        <small class="text-red-500" *ngIf="name?.invalid && name?.touched">Name is required</small>
        </div>

        <div class="md:col-span-1">
          <input type="email" formControlName="email" placeholder="poovarasan@gmail.com" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-colors">
            <small class="text-red-500" *ngIf="email?.invalid && email?.touched">Email is required</small>
        </div>

        <div class="md:col-span-2">
          <input type="text" formControlName="subject" placeholder="Subject" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-colors">
          <small class="text-red-500" *ngIf="subject?.invalid && subject?.touched">Subject is required</small>
        </div>

        <div class="md:col-span-2">
          <textarea formControlName="message" placeholder="Type Your Messege*" rows="6" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-colors"></textarea>
          <small class="text-red-500" *ngIf="message?.invalid && message?.touched">Message is required</small>
        </div>

        <div class="md:col-span-2 text-left">
          <button type="submit" class="bg-pink-500 text-white font-bold py-3 px-10 rounded-md hover:bg-pink-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500 transition-all duration-300 ease-in-out">
            Send Message
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
