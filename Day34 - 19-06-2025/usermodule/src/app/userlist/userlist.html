<div class="min-h-screen p-4 mt-5 bg-gray-50">
  <app-notification
    *ngIf="showSuccess"
    [title]="'Success!'"
    [message]="successMessage"
    [type]="'success'"
  >
    >
  </app-notification>
  <app-notification
    *ngIf="showError"
    [title]="'Error!'"
    [message]="errorMessage"
    [type]="'error'"
  >
    >
  </app-notification>
  <div class="p-6 mb-4 flex justify-end gap-4 bg-slate-200 rounded-lg shadow">
    <input
      #searchInput
      type="text"
      placeholder="Search by username or role"
      class="p-2 border border-gray-400 bg-white rounded-md w-full max-w-md"
    />

    <button
      (click)="addUsers()"
      class="bg-teal-700 text-white px-9 rounded-md hover:bg-teal-800"
    >
      Add New Users
    </button>
  </div>
  <div class="overflow-x-auto mt-5 rounded-lg shadow-md">
    <table class="min-w-full text-left text-sm text-gray-700">
      <thead class="bg-violet-600 text-white text-sm uppercase">
        <tr>
          <th class="px-6 py-3">Username</th>
          <th class="px-6 py-3">Email</th>
          <th class="px-6 py-3">Password</th>
          <th class="px-6 py-3">Role</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngIf="(filteredUsers$ | async) as users">
          <tr *ngIf="users.length === 0">
            <td
              colspan="4"
              class="text-center px-6 py-4 text-red-600 font-semibold"
            >
              No users found
            </td>
          </tr>
          <tr
            *ngFor="let user of users"
            class="bg-white border-b hover:bg-violet-50 transition duration-150"
          >
            <td class="px-6 py-4 font-semibold">{{ user.username }}</td>
            <td class="px-6 py-4 font-medium">{{ user.email }}</td>
            <td class="px-6 py-4 text-gray-500 font">{{ user.password }}</td>
            <td class="px-6 py-4">
              <span
                class="inline-block px-3 py-1 text-xs font-semibold rounded-full"
                [ngClass]="{
            'bg-emerald-100 text-emerald-700': user.role === 'Admin',
            'bg-blue-100 text-blue-700': user.role === 'User'
          }"
              >
                {{ user.role }}
              </span>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>
