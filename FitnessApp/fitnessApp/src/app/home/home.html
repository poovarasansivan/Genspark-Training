<div class="min-h-screen bg-slate-100 py-8 px-8">

    <!-- Welcome Message -->
    <h1 class="text-slate-700  text-xl md:text-2xl font-semibold mb-4 md:mb-4">
      👋 Welcome Back, <span class="text-emerald-700">{{ AdminName }}</span>
    </h1>

  <div
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-6"
  >
    <div
      class="flex items-center justify-between bg-white h-24 shadow-md rounded-lg p-4 w-full"
    >
      <div
        class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-xl"
      >
        <lucide-angular
          [name]="userIcon"
          [size]="24"
          color="oklch(59.6% 0.145 163.225)"
        ></lucide-angular>
      </div>
      <div class="text-right">
        <p class="text-gray-800 font-semibold text-md md:text-lg">Active Users</p>
        <p class="text-gray-500 text-lg">{{acitveUserCount}}</p>
      </div>
    </div>

    <div
      class="flex items-center justify-between bg-white h-24 shadow-md rounded-lg p-4 w-full"
    >
      <div
        class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-600 text-xl"
      >
        <lucide-angular
          [name]="userIcon"
          [size]="24"
          color="oklch(63.7% 0.237 25.331)"
        ></lucide-angular>
      </div>
      <div class="text-right">
        <p class="text-gray-800 font-semibold text-md md:text-lg">Non-Active Users</p>
        <p class="text-gray-500 text-lg">{{inactiveUserCount}}</p>
      </div>
    </div>

    <!-- Card 3 -->
    <div
      class="flex items-center justify-between bg-white h-24 shadow-md rounded-lg p-4 w-full"
    >
      <div
        class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xl"
      >
        <lucide-angular
          [name]="userIcon"
          [size]="24"
          color="oklch(62.3% 0.214 259.815)"
        ></lucide-angular>
      </div>
      <div class="text-right">
        <p class="text-gray-800 font-semibold text-md md:text-lg">Coach</p>
        <p class="text-gray-500 text-lg">{{coachUserCount}}</p>
      </div>
    </div>

    <div
      class="flex items-center justify-between bg-white h-24 shadow-md rounded-lg p-4 w-full"
    >
      <div
        class="w-12 h-12 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 text-xl"
      >
        <lucide-angular
          [name]="planIcon"
          [size]="24"
          color="oklch(37.2% 0.044 257.287)"
        ></lucide-angular>
      </div>
      <div class="text-right">
        <p class="text-gray-800 font-semibold text-md md:text-lg">Plans</p>
        <p class="text-gray-500 text-lg">{{planCount}}</p>
      </div>
    </div>
  </div>
  <div class="">
    <div class="flex flex-col lg:flex-row justify-between md:items-start gap-6">
      <div class="flex-1 min-w-[300px] bg-white p-5 shadow-md rounded-lg">
        <p class="text-slate-700 text-md md:text-lg font-semibold">Plan Analysis</p>
        <app-bar-chart></app-bar-chart>
      </div>
      <div class="flex-1 min-w-[300px] bg-white p-5 shadow-md rounded-lg">
        <p class="text-slate-700 text-md md:text-lg font-semibold">Last 7 Days Logs Stats</p>
        <app-bar-chart2></app-bar-chart2>
      </div>
    </div>
  </div>
</div>
