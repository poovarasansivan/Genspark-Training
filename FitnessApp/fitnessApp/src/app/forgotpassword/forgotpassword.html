<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <app-popup></app-popup>
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">
      Reset Password
    </h2>

    <form (ngSubmit)="reset()" [formGroup]="passwordForm" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1">Password</label>
        <input
          formControlName="password"
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500"
        />
        <small *ngIf="password.invalid && password.touched" class="text-red-500"
          >Password is required</small
        >
      </div>
      <div>
        <label class="block text-gray-700 mb-1">Confirm Password</label>
        <input
          formControlName="confirmPassword"
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500"
        />
        <small
          *ngIf="confirmPassword.invalid && confirmPassword.touched"
          class="text-red-500"
          >Password is required</small
        >
        <div
          *ngIf="passwordForm.errors?.['passwordMismatch'] && passwordForm.touched"
          class="text-red-500 text-xs"
        >
          Passwords do not match.
        </div>
        <div
          *ngIf="password.invalid && (password.dirty || password.touched)"
          class="text-red-600 text-xs"
        >
          <div *ngIf="password.errors?.['minlength']">
            Password must be at least 8 characters.
          </div>
          <div *ngIf="password.errors?.['maxlength']">
            Password must be at most 20 characters.
          </div>
          <div *ngIf="password.errors?.['complexPassword']" class="text-xs">
            Password must include uppercase, lowercase, number, and special
            character.
          </div>
        </div>
      </div>

      <button
        type="submit"
        class="w-full bg-emerald-600 text-white py-2 rounded-md hover:bg-emerald-700 transition"
        [disabled]="passwordForm.invalid"
      >
        Submit
      </button>
    </form>
  </div>
</div>
