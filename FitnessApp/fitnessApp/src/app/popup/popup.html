<!-- toast.component.html -->
<div class="fixed top-4 right-4 z-50 mt-10 transition-opacity duration-500 ease-in-out"
     [ngClass]="{ 'opacity-0': !show, 'opacity-100': show }">
  <div
    [ngClass]="{
      'bg-white text-gray-700 border border-gray-200 dark:bg-gray-800 dark:text-gray-300': type === 'info',
      'bg-green-100 text-green-800 border border-green-300 dark:bg-green-900 dark:text-green-200': type === 'success',
      'bg-red-100 text-red-800 border border-red-300 dark:bg-red-900 dark:text-red-200': type === 'error'
    }"
    class="flex items-center max-w-lg p-4 space-x-4 rtl:space-x-reverse divide-x rtl:divide-x-reverse divide-gray-200 rounded-lg shadow-sm"
    role="alert"
  >
    <svg *ngIf="type === 'success'" class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>

    <svg *ngIf="type === 'error'" class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>

    <svg *ngIf="type === 'info'" class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M12 20a8 8 0 100-16 8 8 0 000 16z" />
    </svg>

    <div class="ps-4 text-sm font-normal">{{ message }}</div>
  </div>
</div>
