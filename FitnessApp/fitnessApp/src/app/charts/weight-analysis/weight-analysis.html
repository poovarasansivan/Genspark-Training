<ng-container *ngIf="chartReady; else noDataTemplate">
  <apx-chart
    [series]="series"
    [chart]="chart"
    [dataLabels]="dataLabels"
    [fill]="fill"
    [yaxis]="yaxis"
    [xaxis]="xaxis"
    [tooltip]="tooltip"
  ></apx-chart>
</ng-container>
<ng-template #noDataTemplate>
  <div class="flex items-center text-red-500 justify-center h-full">
    No data available 
  </div>
</ng-template>
