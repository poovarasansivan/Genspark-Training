<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <app-popup></app-popup>
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
    <div class="flex flex-row gap-3 justify-center align-middle mb-6">
    <lucide-angular [name]="DumbbellIcon" [size]="30" color="#3B82F6"></lucide-angular>
      <p class="text-2xl font-bold text-blue-600">Fitness Tracking </p>
    </div>
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Login</h2>

    <form (ngSubmit)="login()" [formGroup]="loginForm" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1">Email</label>
        <input
          formControlName="email"
          type="email"
          placeholder="poovarsan@example.com"
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500"
        />
        <small *ngIf="email.invalid && email.touched" class="text-red-500">Valid email required</small>
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Password</label>
        <input
          formControlName="password"
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500"
        />
        <small *ngIf="password.invalid && password.touched" class="text-red-500">Password is required</small>
      </div>

      <button
        type="submit"
        class="w-full bg-emerald-600 text-white py-2 rounded-md hover:bg-emerald-700 transition"
        [disabled]="loginForm.invalid"
      >
        Login
      </button>
    </form>
    <p class="mt-3 flex flex-row text-gray-700 items-center justify-center">Forgot Password ? <span class="text-blue-600 ml-1 cursor-pointer" (click)="resetPassword()">Click Here</span></p>
  </div>
</div>
